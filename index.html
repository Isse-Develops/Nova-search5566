<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novasearch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
            color: #202124;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            gap: 15px;
        }

        header a {
            text-decoration: none;
            color: #5f6368;
            font-size: 14px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .btn-login {
            background-color: #1a73e8;
            color: #ffffff !important;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none !important;
        }

        .btn-login:hover {
            background-color: #1557b0;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            margin-top: -50px;
        }

        .logo-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo-img {
            max-width: 280px;
            height: auto;
        }

        .search-box {
            width: 100%;
            max-width: 580px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn-search {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .btn-search:hover {
            border: 1px solid #dadce0;
            color: #202124;
        }

        .ai-mode-box {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #5f6368;
        }

        footer {
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        footer a {
            color: #70757a;
            text-decoration: none;
            margin-right: 15px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="bilder.html">Bilder</a>
        <a href="general.html">Inställningar</a>
        <a href="login.html" class="btn-login">Logga in</a>
    </header>

    <main>
        <div class="logo-container">
            <img src="logo.svg" alt="Novasearch Logo" class="logo-img">
        </div>

        <form action="#" method="GET" class="search-box" onsubmit="event.preventDefault(); alert('Söker på Novasearch...');">
            <input type="text" class="search-input" placeholder="Sök på Novasearch eller skriv en URL..." id="searchInput">
            
            <div class="buttons">
                <button type="submit" class="btn-search">Novasökning</button>
                <button type="button" class="btn-search" onclick="toggleAI()">Nova AI-läge</button>
            </div>
        </form>

        <div class="ai-mode-box">
            <input type="checkbox" id="aiToggle">
            <label for="aiToggle">Aktivera avancerad AI-sammanfattning</label>
        </div>
    </main>

    <footer>
        <div>
            <a href="about.html">Om Novasearch</a>
            <a href="general.html">General & Rapportera</a>
        </div>
        <div>
            <a href="general.html">Säkerhet & Filter</a>
        </div>
    </footer>

    <script>
        function toggleAI() {
            const checkbox = document.getElementById('aiToggle');
            checkbox.checked = !checkbox.checked;
            if(checkbox.checked) {
                alert('Nova AI-läge aktiverat!');
            }
        }
    </script>
</body>
</html>
